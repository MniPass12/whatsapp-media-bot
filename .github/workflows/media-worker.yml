name: WhatsApp Media Offload Worker

on:
  repository_dispatch:
    types: [whatsapp_media_job]
  workflow_dispatch:
    inputs:
      video_url:
        description: "Media URL to download and compress"
        required: false
        type: string
      to:
        description: "WhatsApp opaque recipient user:<id>"
        required: true
        type: string
      mode:
        description: "Media mode (video, audio, or emrandom)"
        required: true
        default: "video"
        type: choice
        options:
          - video
          - audio
          - emrandom
      quality:
        description: "Quality preference (auto, 480p, 360p, audio)"
        required: false
        default: "auto"
      job_id:
        description: "Optional D1 tracking job ID"
        required: false
        default: "manual_dispatch"

jobs:
  process-media:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Deno runtime for yt-dlp & PO Token server
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install FFmpeg, yt-dlp, and bgutil PO Token plugin
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python3 -m pip install --upgrade --break-system-packages "yt-dlp[default]" bgutil-ytdlp-pot-provider

      - name: Start bgutil PO Token provider server
        run: |
          git clone --depth 1 https://github.com/Brainicism/bgutil-ytdlp-pot-provider.git /tmp/bgutil-pot
          cd /tmp/bgutil-pot/server
          deno install --frozen
          nohup deno run -A src/main.ts > /tmp/bgutil.log 2>&1 &
          for i in $(seq 1 15); do
            if curl -sf http://127.0.0.1:4416/ping >/dev/null 2>&1; then
              echo "bgutil PO token server is ready"
              break
            fi
            sleep 1
          done
          cat /tmp/bgutil.log || true

      - name: Start Cloudflare WARP SOCKS5 proxy (bypass datacenter IP blocks)
        continue-on-error: true
        run: |
          mkdir -p /tmp/warp && cd /tmp/warp
          curl -fsSL -o wgcf https://github.com/ViRb3/wgcf/releases/download/v2.3.1/wgcf_2.3.1_linux_amd64
          chmod +x wgcf
          curl -fsSL -o wireproxy.tar.gz https://github.com/windtf/wireproxy/releases/download/v1.1.3/wireproxy_linux_amd64.tar.gz
          tar -xzf wireproxy.tar.gz
          ./wgcf register --accept-tos
          ./wgcf generate
          cat << 'EOF' > wireproxy.conf
          WGConfig = /tmp/warp/wgcf-profile.conf

          [Socks5]
          BindAddress = 127.0.0.1:40000
          EOF
          nohup ./wireproxy -c wireproxy.conf > /tmp/wireproxy.log 2>&1 &
          for i in $(seq 1 15); do
            if curl -sf --socks5-hostname 127.0.0.1:40000 https://www.cloudflare.com/cdn-cgi/trace | grep -q "warp=on"; then
              echo "Cloudflare WARP SOCKS5 proxy ready on 127.0.0.1:40000"
              touch /tmp/warp_ready
              break
            fi
            sleep 1
          done
          cat /tmp/wireproxy.log || true

      - name: Process and send WhatsApp media
        env:
          WHATSAPP_ACCESS_TOKEN: ${{ secrets.WHATSAPP_ACCESS_TOKEN }}
          WORKER_CALLBACK_URL: ${{ secrets.WORKER_CALLBACK_URL }}
          CALLBACK_SECRET: ${{ secrets.CALLBACK_SECRET }}
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
          BGUTIL_PLUGIN_DIR: /tmp/bgutil-pot/plugin
          WARP_PROXY: socks5h://127.0.0.1:40000
          PAYLOAD_JSON: ${{ toJson(github.event.client_payload) }}
          INPUT_VIDEO_URL: ${{ inputs.video_url }}
          INPUT_TO: ${{ inputs.to }}
          INPUT_MODE: ${{ inputs.mode }}
          INPUT_QUALITY: ${{ inputs.quality }}
          INPUT_JOB_ID: ${{ inputs.job_id }}
        run: node scripts/process-media.mjs
